services:
  fast-fashion-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FAST_FASHION_HOST: ${FAST_FASHION_HOST:-0.0.0.0}
      FAST_FASHION_PORT: ${FAST_FASHION_PORT:-8765}
      FAST_FASHION_DB_PATH: ${FAST_FASHION_DB_PATH:-/app/runtime/catalog.db}
      FAST_FASHION_API_TOKEN: ${FAST_FASHION_API_TOKEN}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      FAST_FASHION_S3_ADMIN_PASSWORD: ${FAST_FASHION_S3_ADMIN_PASSWORD:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_URL: ${AWS_URL:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    volumes:
      - ../files/fast-fashion-dashboard/runtime:/app/runtime
      - ../files/fast-fashion-dashboard/data:/app/data
